<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login | BuyEver</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/style.css">

<style>
/* LOGIN PAGE ANIMATION */
.login-wrapper{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#8277e7,#ff6f91);
}

.login-box{
  width:360px;
  background:#fff;
  padding:25px;
  border-radius:20px;
  box-shadow:0 15px 40px rgba(0,0,0,.25);
  animation:slideUp .7s ease;
  position:relative;
  overflow:hidden;
}

.login-box::before{
  content:"";
  position:absolute;
  top:-50%;
  left:-50%;
  width:200%;
  height:200%;
  background:linear-gradient(45deg,transparent,#8277e7,transparent);
  animation:rotate 6s linear infinite;
  opacity:.15;
}

.login-box h2{
  text-align:center;
  margin-bottom:20px;
  position:relative;
}

.login-box input{
  width:100%;
  padding:14px;
  margin:10px 0;
  border-radius:12px;
  border:1px solid #ddd;
  outline:none;
  transition:.3s;
}

.login-box input:focus{
  border-color:#8277e7;
  box-shadow:0 0 0 3px rgba(130,119,231,.2);
  transform:scale(1.02);
}

.login-box button{
  width:100%;
  padding:14px;
  margin-top:10px;
  border:none;
  border-radius:14px;
  background:#8277e7;
  color:#fff;
  font-size:16px;
  cursor:pointer;
  transition:.3s;
}

.login-box button:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 20px rgba(0,0,0,.25);
  background:#6a60d6;
}

.login-box small{
  display:block;
  margin-top:12px;
  text-align:center;
  color:#666;
  font-size:12px;
}

/* ANIMATIONS */
@keyframes slideUp{
  from{opacity:0;transform:translateY(60px) scale(.9)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
@keyframes rotate{
  from{transform:rotate(0deg)}
  to{transform:rotate(360deg)}
}
</style>
</head>

<body>

<div class="login-wrapper">

  <div class="login-box">
    <h2>Login to BuyEver</h2>

    <input type="text" id="name" placeholder="Full Name">
    <input type="tel" id="mobile" placeholder="Mobile Number">

    <button onclick="login()">Continue</button>

    <small>Secure Login • OTP based (Backend ready)</small>
  </div>

</div>

<script>
function login(){
  let name=document.getElementById("name").value;
  let mobile=document.getElementById("mobile").value;

  if(name==="" || mobile===""){
    alert("Please fill all details");
    return;
  }

  localStorage.setItem("user",JSON.stringify({
    name:name,
    mobile:mobile
  }));

  location.href="profile.html";
}
</script>

</body>
</html>
