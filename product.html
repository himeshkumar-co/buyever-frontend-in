<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Product Details | BuyEver</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="logo">Buy<span>Ever</span></div>
  <input class="search" placeholder="Search products...">
  <div class="icons">
    <span onclick="location.href='cart.html'">🛒</span>
    <span onclick="location.href='profile.html'">👤</span>
  </div>
</div>

<!-- PRODUCT -->
<div class="products" style="grid-template-columns:1fr;">
  <div class="card">
    <img src="images/p1.jpg" style="height:220px;object-fit:contain">
    <h3>Sample Product Name</h3>
    <p>
      <b style="font-size:18px">₹299</b>
      <del>₹499</del>
      <span class="badge">40% OFF</span>
    </p>

    <p style="font-size:14px;color:#555">
      High quality product for daily use. Best price guaranteed.
    </p>

    <button class="primary-btn" onclick="addToCart()">Add to Cart</button>
  </div>
</div>

<footer>© 2026 BuyEver</footer>

<script>
function addToCart(){
  let cart = JSON.parse(localStorage.getItem("cart")) || [];
  cart.push({
    name:"Sample Product",
    price:299,
    image:"images/p1.jpg",
    qty:1
  });
  localStorage.setItem("cart",JSON.stringify(cart));
  alert("Added to cart 🛒");
}
</script>

</body>
</html>
