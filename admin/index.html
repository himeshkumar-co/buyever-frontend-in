<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Buy Ever Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="#"><i class="fas fa-store"></i> Buy Ever Admin</a>
      <div class="navbar-nav ms-auto">
        <a class="nav-link active" href="index.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
        <a class="nav-link" href="categories.html"><i class="fas fa-tags"></i> Categories</a>
        <a class="nav-link" href="products.html"><i class="fas fa-box"></i> Products</a>
        <a class="nav-link" href="cart.html"><i class="fas fa-shopping-cart"></i> Cart</a>
      </div>
    </div>
  </nav>

  <div class="container mt-4">
    <h1 class="mb-4"><i class="fas fa-chart-line"></i> Dashboard</h1>
    <div class="row">
      <div class="col-md-4">
        <div class="card bg-success text-white mb-4">
          <div class="card-body">
            <h5 class="card-title"><i class="fas fa-tags"></i> Total Categories</h5>
            <h2 id="totalCategories">0</h2>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card bg-info text-white mb-4">
          <div class="card-body">
            <h5 class="card-title"><i class="fas fa-box"></i> Total Products</h5>
            <h2 id="totalProducts">0</h2>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card bg-warning text-white mb-4">
          <div class="card-body">
            <h5 class="card-title"><i class="fas fa-shopping-cart"></i> Cart Items</h5>
            <h2 id="totalCartItems">0</h2>
          </div>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-md-6">
        <div class="card">
          <div class="card-header">
            <h5><i class="fas fa-tags"></i> Recent Categories</h5>
          </div>
          <div class="card-body">
            <ul id="recentCategories" class="list-group list-group-flush">
              <!-- Recent categories will be loaded here -->
            </ul>
          </div>
        </div>
      </div>
      <div class="col-md-6">
        <div class="card">
          <div class="card-header">
            <h5><i class="fas fa-box"></i> Recent Products</h5>
          </div>
          <div class="card-body">
            <ul id="recentProducts" class="list-group list-group-flush">
              <!-- Recent products will be loaded here -->
            </ul>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
