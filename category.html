<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Category Products | BuyEver</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- HEADER -->
<div class="header">
  <div class="logo">Buy<span>Ever</span></div>
  <input class="search" placeholder="Search products...">
  <div class="icons">
    <span onclick="location.href='cart.html'">🛒</span>
    <span onclick="location.href='profile.html'">👤</span>
  </div>
</div>

<!-- CATEGORY TITLE -->
<h2 class="section-title" id="categoryTitle">Category Name</h2>

<!-- PRODUCT GRID -->
<div class="products" id="productGrid">
  <!-- JS se 30 products aayenge -->
</div>

<footer>© 2026 BuyEver</footer>

<script>
/* ===== CATEGORY + 30 PRODUCTS LOGIC ===== */

const categoryName =
  new URLSearchParams(window.location.search).get("cat") || "Grocery";

document.getElementById("categoryTitle").innerText = categoryName;

/* 30 PRODUCTS PER CATEGORY */
const products = [];

for(let i=1;i<=30;i++){
  products.push({
    id:i,
    name: categoryName + " Product " + i,
    price: 100 + i*5,
    mrp: 150 + i*5,
    image: "images/p"+((i%5)+1)+".jpg"
  });
}

const grid = document.getElementById("productGrid");

products.forEach(p=>{
  grid.innerHTML += `
    <div class="card" onclick="location.href='product.html'">
      <span class="badge red">${Math.floor((p.mrp-p.price)/p.mrp*100)}% OFF</span>
      <img src="${p.image}">
      <h4>${p.name}</h4>
      <p>
        <b>₹${p.price}</b>
        <del>₹${p.mrp}</del>
      </p>
      <button class="primary-btn">Add to Cart</button>
    </div>
  `;
});
</script>

</body>
</html>
