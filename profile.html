<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Profile | BuyEver</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/style.css">
<style>
.profile-box{
  background:#fff;
  margin:15px;
  padding:20px;
  border-radius:20px;
  animation:fade .4s;
}
.profile-box h3{margin-bottom:8px}
.profile-menu div{
  background:#f5f5f5;
  padding:12px;
  margin:10px 0;
  border-radius:12px;
  cursor:pointer;
  animation:pop .4s;
}
.profile-menu div:hover{
  background:#e3f2fd;
}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="logo">Buy<span>Ever</span></div>
  <div class="icons">
    <span onclick="location.href='cart.html'">🛒</span>
    <span onclick="logout()">🚪</span>
  </div>
</div>

<div class="profile-box">
  <h3 id="username"></h3>
  <p id="usermobile"></p>
</div>

<div class="profile-menu">
  <div onclick="go('orders.html')">📦 My Orders</div>
  <div onclick="go('track.html')">🚚 Track Order</div>
  <div onclick="go('address.html')">🏠 Saved Addresses</div>
  <div onclick="alert('Language feature backend se connect hoga')">🌐 Select Language</div>
  <div onclick="alert('UPI & Bank backend module')">💳 Bank & UPI Details</div>
  <div onclick="alert('About BuyEver')">ℹ️ About Us</div>
  <div onclick="alert('Privacy Policy')">🔐 Privacy Policy</div>
  <div onclick="alert('Return policy')">↩️ Returns</div>
</div>

<footer>© 2026 BuyEver</footer>

<script>
let user = JSON.parse(localStorage.getItem("user"));

if(!user){
  location.href="login.html";
}

document.getElementById("username").innerText = "Hello, " + user.name;
document.getElementById("usermobile").innerText = "📱 " + user.mobile;

function logout(){
  localStorage.removeItem("user");
  alert("Logged out");
  location.href="login.html";
}
function go(page){
  location.href=page;
}
</script>

</body>
</html>
