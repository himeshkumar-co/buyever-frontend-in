<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Cart | BuyEver</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="logo">Buy<span>Ever</span></div>
  <input class="search" placeholder="Search products...">
  <div class="icons">
    <span onclick="location.href='index.html'">🏠</span>
    <span>🛒</span>
  </div>
</div>

<h2 class="section-title">My Cart</h2>

<div class="products" id="cartItems"></div>

<div style="padding:15px">
  <button class="primary-btn" onclick="checkout()">Proceed to Checkout</button>
</div>

<footer>© 2026 BuyEver</footer>

<script>
const cartDiv = document.getElementById("cartItems");
let cart = JSON.parse(localStorage.getItem("cart")) || [];

if(cart.length === 0){
  cartDiv.innerHTML = "<p style='padding:20px'>Your cart is empty 😔</p>";
}

let total = 0;

cart.forEach((item,index)=>{
  total += item.price * item.qty;

  cartDiv.innerHTML += `
    <div class="card">
      <img src="${item.image}" style="height:120px;object-fit:contain">
      <h4>${item.name}</h4>
      <p><b>₹${item.price}</b></p>
      <button class="primary-btn" onclick="removeItem(${index})">
        Remove
      </button>
    </div>
  `;
});

cartDiv.innerHTML += `
  <div class="card">
    <h3>Total Amount</h3>
    <h2>₹${total}</h2>
  </div>
`;

function removeItem(i){
  cart.splice(i,1);
  localStorage.setItem("cart",JSON.stringify(cart));
  location.reload();
}

function checkout(){
  alert("Checkout & payment module backend me connect hoga 💳");
}
</script>

</body>
</html>
